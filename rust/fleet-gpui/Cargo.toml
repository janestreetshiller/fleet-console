[package]
name = "fleet-gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "GPUI desktop client for the FleetConsole controller on macOS and Linux."

[features]
default = []
fixtures = ["fleet-ui-core/fixtures"]

[dependencies]
gpui = "=0.2.2"
serde_json.workspace = true
fleet-ui-core = { path = "../fleet-ui-core" }
futures = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"
cocoa = "0.26"

[dev-dependencies]
fleet-ui-core = { path = "../fleet-ui-core", features = ["fixtures"] }

[[bin]]
name = "fleet-gpui"
path = "src/main.rs"

[lib]
name = "fleet_gpui"
path = "src/lib.rs"
