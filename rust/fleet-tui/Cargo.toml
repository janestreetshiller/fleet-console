[package]
name = "fleet-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Terminal client for the FleetConsole controller on macOS and Linux."

[features]
default = []
fixtures = ["fleet-ui-core/fixtures"]

[dependencies]
fleet-ui-core = { path = "../fleet-ui-core" }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }

[dev-dependencies]
fleet-ui-core = { path = "../fleet-ui-core", features = ["fixtures"] }

[[bin]]
name = "fleet-tui"
path = "src/main.rs"
