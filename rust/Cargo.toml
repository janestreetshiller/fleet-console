[workspace]
resolver = "2"
members = [
    "fleet-proto",
    "fleet-conformance",
    "fleet-agent",
    "fleet-telemetry",
    "ouros-adapter",
    "fleet-spatial",
    "fleet-gpui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
tempfile = "3"
sysinfo = "0.31"
gpui = "=0.2.2"
fleet-proto = { path = "fleet-proto" }
fleet-telemetry = { path = "fleet-telemetry" }
ouros-adapter = { path = "ouros-adapter" }
fleet-spatial = { path = "fleet-spatial" }
