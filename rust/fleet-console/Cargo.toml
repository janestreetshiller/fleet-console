[package]
name = "fleet-console"
version = "1.3.0"
edition.workspace = true
rust-version.workspace = true
description = "FleetConsole production app: GPUI menubar (macOS) / system tray (Linux) shell. Rebuild of the Swift 1.3.0 app; see WORKLOG.md parity list."

[[bin]]
name = "FleetConsole"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
futures = "0.3"
sysinfo.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"
cocoa = "0.26"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
