name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build and tests
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record toolchain versions
        run: |
          swift --version
          cargo --version
      - name: Check shell syntax
        run: |
          for script in Scripts/*.sh; do bash -n "$script"; done
      - name: Run non-destructive release-policy regressions
        env:
          TMPDIR: ${{ runner.temp }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 Scripts/test-release-policy.py
          PYTHONOPTIMIZE=1 python3 Scripts/test-release-policy.py
      - name: Build release with the existing CMO workaround
        run: swift build -c release --disable-index-store -Xswiftc -disable-cmo
      - name: Run Swift tests
        run: swift test --disable-index-store
      - name: Check Rust protocol and conformance targets
        run: >-
          cargo check --manifest-path rust/Cargo.toml
          --workspace --all-targets --locked
