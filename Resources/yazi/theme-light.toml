[pick]
border = { fg = "#B9BBC0" }
active = { fg = "#FFFFFF", bg = "#16181C", bold = true }
inactive = { fg = "#3C3E44" }

[input]
border = { fg = "#B9BBC0" }
title = { fg = "#16181C" }
value = { fg = "#16181C" }
selected = { fg = "#FFFFFF", bg = "#3C3E44" }

[cmp]
border = { fg = "#B9BBC0" }
active = { fg = "#FFFFFF", bg = "#16181C" }
inactive = { fg = "#3C3E44" }

[tasks]
border = { fg = "#B9BBC0" }
title = { fg = "#16181C" }
