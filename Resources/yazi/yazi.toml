
[mgr]
ratio = [0, 4, 2]

sort_by = "alphabetical"
sort_dir_first = true
sort_sensitive = false
show_hidden = false

show_symlink = true

scrolloff = 2

[preview]
max_width = 300
max_height = 200
wrap = "no"

[opener]
reveal = [
	{ run = 'open -R "$1"', desc = "Reveal in Finder", orphan = true, for = "macos" },
]

[open]
rules = [{ url = "*", use = "reveal" }]
